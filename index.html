<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drawing Review</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112,800&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Drawing transmittal / sign-off sheet: white, black, signal red. */
:root{color-scheme:dark;--bg:#0e0e0e;--ink:#eee;--mute:#9a9a9a;--line:#2c2c2c;--soft:#181818;--red:#e4002b}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Archivo,system-ui,sans-serif;overflow-x:clip}
h1,h2,.big,.part .k{font-family:Archivo,system-ui,sans-serif;font-stretch:112%;font-weight:800;line-height:1.05;margin:0}
h1{font-size:clamp(22px,3.2vw,36px);text-wrap:balance}h2{font-size:17px}
a{color:inherit}
button,textarea,input{font:inherit;color:inherit}
button{min-height:40px;padding:0 14px;border:1.5px solid var(--ink);background:var(--bg);cursor:pointer;border-radius:0}
button:focus-visible,textarea:focus-visible,input:focus-visible,.part:focus-visible{outline:3px solid var(--red);outline-offset:2px}
button.on{background:var(--ink);color:var(--bg)}button:disabled{opacity:.4;cursor:not-allowed}
header{border-top:8px solid var(--ink);padding:16px max(3vw,14px) 12px;display:flex;flex-wrap:wrap;gap:12px 32px;align-items:end;justify-content:space-between}
.sub{color:var(--mute);font-size:14px;margin-top:4px}
.release{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.big{font-size:clamp(30px,4vw,46px)}
.apbtn{min-height:48px;padding:0 28px;font-size:17px;font-weight:700;background:#f5c518;color:#111;border:2px solid #f5c518;white-space:nowrap}.apbtn:hover{background:#e0b200;border-color:#e0b200}.apbtn.done{background:#1f9d55;border-color:#1f9d55;color:#fff}
main{display:grid;grid-template-columns:230px minmax(0,1fr) 330px;border-top:1.5px solid var(--ink);min-height:calc(100vh - 110px)}
aside{border-right:1px solid var(--line)}
.rail-h{padding:12px 14px;font-size:13px;color:var(--mute);border-bottom:1px solid var(--line)}
.part{display:grid;grid-template-columns:34px 1fr auto;gap:2px 10px;align-items:center;padding:10px 14px;border:0;border-bottom:1px solid var(--line);width:100%;text-align:left;background:none;min-height:56px}
.part .k{font-size:24px;grid-row:span 2}.part .n{font-weight:600;font-size:14px}.part .q{font-size:12px;color:var(--mute)}
.prow{position:relative}.prow .part{padding-right:48px}.pk{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer}.pk input{width:20px;height:20px;accent-color:var(--red);cursor:pointer}
.sendc{border:2px solid var(--red);padding:12px;display:flex;flex-direction:column;gap:10px}
.part.sel{background:var(--soft);box-shadow:inset 4px 0 0 var(--ink)}
.dot{width:12px;height:12px;border:2px solid var(--mute);border-radius:50%;grid-row:span 2}
.dot.approved{background:var(--ink);border-color:var(--ink)}.dot.rejected{background:var(--red);border-color:var(--red)}.dot.stale{border-color:var(--red);border-style:dashed}
.center{display:flex;flex-direction:column;min-height:540px}
.tabs{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tabs button{border:0;border-right:1px solid var(--line);min-height:44px}
.cnt{display:inline-block;background:var(--red);color:#fff;font-size:11px;padding:0 6px;margin-left:6px;border-radius:9px}.cnt:empty{display:none}
.pane{position:relative;flex:1;min-height:480px;display:none}.pane.show{display:block}
#three{position:absolute;inset:0}
.tool{position:absolute;left:12px;top:12px;right:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;pointer-events:none;z-index:2}
.tool>*{pointer-events:auto;background:var(--bg)}
.tool label.sel{padding:0}.tool select{min-height:37px;border:0;background:transparent;font:inherit;font-size:14px;padding:0 8px;max-width:260px;color:inherit}
.tool label{display:flex;align-items:center;gap:8px;border:1.5px solid var(--ink);padding:0 10px;min-height:40px;font-size:14px}
.hint{position:absolute;left:12px;bottom:10px;font-size:13px;color:var(--mute);background:var(--bg);padding:2px 6px}
.mlabel{position:absolute;transform:translate(-50%,-140%);background:#ffd400;color:#111;font-weight:600;font-size:13px;padding:2px 8px;pointer-events:none;display:none;white-space:nowrap}
.mtip{position:absolute;display:none;pointer-events:none;background:#00e5ff;color:#111;font-weight:600;font-size:13px;padding:3px 8px;white-space:nowrap;z-index:3}
.mout{position:absolute;left:12px;right:12px;top:64px;font-size:15px;pointer-events:none;z-index:2}.mout span:not(:empty){display:inline-block;margin-top:4px}.mout span:not(:empty){background:var(--bg);padding:3px 6px}
#pdfBox,#dxfBox{position:absolute;inset:56px 0 0 0;overflow:auto;background:var(--soft)}
#pdfBox canvas{display:block;margin:12px auto;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.15)}
#dxfBox{overflow:hidden;cursor:grab;touch-action:none}#dxfBox svg{width:100%;height:100%;display:block}
.geo line,.geo circle,.geo path{stroke:currentColor;stroke-width:1.3px;vector-effect:non-scaling-stroke;fill:none}.hv,.rs{fill:none;stroke:#00e5ff;vector-effect:non-scaling-stroke}.rs{stroke:#ffd400}.hvf{fill:#00e5ff}.rsf{fill:#ffd400}
.geo .bend{stroke:var(--red);stroke-dasharray:8 5}
.facts{position:absolute;right:12px;bottom:12px;max-width:340px;pointer-events:none;background:var(--bg);border:1.5px solid var(--ink);padding:8px 12px;font-size:13px;line-height:1.6}
#checks{padding:18px max(2vw,14px);overflow:auto;position:absolute;inset:0}
.chk{display:grid;grid-template-columns:86px 1fr;gap:4px 14px;padding:12px 0;border-bottom:1px solid var(--line)}
.chk .t{font-weight:600}.chk p{margin:2px 0 0;color:var(--mute);font-size:14px;grid-column:2;max-width:70ch}
.tag{font-size:12px;font-weight:600;border:1.5px solid currentColor;padding:2px 6px;align-self:start;text-align:center}
.tag.issue{color:var(--red)}.tag.ok{color:var(--mute)}
.review>*{flex-shrink:0}
.review{border-left:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:12px}
.files{font-size:13px;border:1px solid var(--line)}.files div{display:flex;justify-content:space-between;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line)}.files div:last-child{border:0}
.state{font-weight:600}.state.rejected,.state.stale{color:var(--red)}
textarea,input[type=text],input[type=email],input[type=password]{width:100%;border:1.5px solid var(--ink);padding:8px;font-size:16px;background:var(--bg)}
textarea{min-height:84px;resize:vertical}#lkUrl{min-height:0;height:48px;resize:none;overflow:hidden;white-space:nowrap;line-height:30px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btnl{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 14px;border:1.5px solid var(--ink);text-decoration:none;font-weight:600}.btnl.on{background:var(--ink);color:var(--bg)}
.acts .ap{background:var(--ink);color:var(--bg)}.acts .rj{border-color:var(--red);color:var(--red)}
.voice{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.voice label.file{display:inline-flex;align-items:center;min-height:40px;padding:0 12px;border:1.5px dashed var(--ink);cursor:pointer;font-size:14px}
.voice input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
.voice audio{width:100%;height:36px}
.rec{color:var(--red);font-weight:600}
.msg{font-size:13px;color:var(--mute);min-height:1em}.msg.err{color:var(--red)}
.ev{padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.ev .d{font-weight:600}.ev .d.reject{color:var(--red)}.ev .when{color:var(--mute);font-size:12px}.ev .old{font-size:12px;color:var(--red)}
.ev p{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.empty{color:var(--mute);font-size:14px}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;background:var(--bg);z-index:5;padding:20px;text-align:center}
.loading.hide{display:none}
.bar{width:260px;height:6px;background:var(--line);position:relative;overflow:hidden}.bar i{position:absolute;inset:0 auto 0 0;width:0;background:var(--ink);transition:width .25s}.pct{font-weight:600;font-variant-numeric:tabular-nums}.loading.err #loadMsg{color:var(--red);font-weight:600;max-width:520px}.loading.err .bar,.loading.err .pct{display:none}
.drop{border:2px dashed var(--ink);padding:22px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;background:var(--soft)}
.drop.over{border-color:var(--red);background:var(--bg)}
.drop input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
.drop .pick{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border:1.5px solid var(--ink);cursor:pointer;background:var(--bg)}
.upl{max-width:760px;padding:0 max(3vw,14px) 24px;display:flex;flex-direction:column;gap:10px}
.upl.panel{padding:16px max(3vw,14px);border-top:1.5px solid var(--ink);max-width:none}
.upl[hidden],#upMore[hidden]{display:none!important}
.lkrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.or{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:13px}.or::before,.or::after{content:'';flex:1;border-top:1px solid var(--line)}
.drop .pick.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.upl ul{margin:0;padding-left:18px;font-size:14px}
.plist{max-width:760px;padding:10px max(3vw,14px) 40px}
.plist a{display:flex;justify-content:space-between;gap:12px;padding:16px 0;border-bottom:1px solid var(--line);text-decoration:none;font-weight:600;font-size:17px}
.plist a span{color:var(--mute);font-weight:400;font-size:14px;white-space:nowrap}
@media(min-width:1101px){html,body{height:100%;overflow:hidden}#app{height:100vh;display:flex;flex-direction:column}#app>main{flex:1;min-height:0;grid-template-rows:minmax(0,1fr)}aside,.review{overflow-y:auto;min-height:0}.center,.pane{min-height:0}aside{scrollbar-width:thin}}
@media(max-width:1100px){main{grid-template-columns:200px minmax(0,1fr)}.review{grid-column:1/-1;border-left:0;border-top:1.5px solid var(--ink)}}
@media(max-width:700px){main{grid-template-columns:minmax(0,1fr)}aside{border-right:0}#rail{display:flex;overflow-x:auto}.prow{min-width:200px;border-right:1px solid var(--line)}.rail-h{display:none}.pane{min-height:430px}.tool button{padding:0 10px}.tool label{padding:0 8px}.hint{display:none}.mout{top:110px}.facts{left:12px;right:12px;max-width:none}}
@media(prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>

<script>
{
/* ===== settings ===== */
const API_KEY='AIzaSyATYc_75Jeq6O8q4IRGJcoqrRK11e-9Vuc';   // Google Drive API key (reads public folders only)
/* ===================== */
const Q=new URLSearchParams(location.search);
const PROJECT_ID=(Q.get('f')||'').replace(/[^\w-]/g,''),RKEY=(Q.get('rk')||'').replace(/[^\w-]/g,''),WA=(Q.get('wa')||'').replace(/\D/g,''),TO=(Q.get('to')||'').trim();
const APP_URL=location.origin+location.pathname;
/* PDF.js: viewer and worker always from the same version */
const PDFJS='https://cdn.jsdelivr.net/npm/pdfjs-dist@6.5.438/build/';let pdfjsLib=null;
const OCCT_BASE='https://cdn.jsdelivr.net/npm/occt-import-js@0.0.23/dist/';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const f2=v=>(+(+v).toFixed(2)).toString();
const G='https://www.googleapis.com/drive/v3/files';
async function gfetch(url,kind){
  const h={};if(RKEY&&PROJECT_ID)h['X-Goog-Drive-Resource-Keys']=PROJECT_ID+'/'+RKEY;
  let r;try{r=await fetch(url+(url.includes('?')?'&':'?')+'supportsAllDrives=true&key='+encodeURIComponent(API_KEY),{headers:h})}catch(e){throw new Error('Could not reach Google Drive. Check the internet connection.')}
  if(!r.ok){let m='';try{m=(await r.json()).error.message}catch(e){}
    if(r.status===404||r.status===403&&!/key/i.test(m))throw new Error('Google Drive won\'t open this. The folder must be shared as "Anyone with the link".');
    throw new Error('Google Drive error '+r.status+(m?': '+m:''))}
  return kind==='json'?r.json():kind==='text'?r.text():new Uint8Array(await r.arrayBuffer())}
async function driveList(id){let out=[],pt='';do{const j=await gfetch(G+'?q='+encodeURIComponent(`'${id}' in parents and trashed=false`)+'&fields=nextPageToken,files(id,name,mimeType,size,modifiedTime)&pageSize=1000&includeItemsFromAllDrives=true'+(pt?'&pageToken='+pt:''),'json');out=out.concat(j.files||[]);pt=j.nextPageToken}while(pt);return out}
async function folderMeta(id){const m=await gfetch(G+'/'+id+'?fields=id,name,mimeType','json');if(m.mimeType!=='application/vnd.google-apps.folder')throw new Error('This link is a single file. Use the link of the FOLDER that holds the STEP, DXF and PDF files.');return m}
async function scanProject(id){const meta=await folderMeta(id);
  const out={id,name:meta.name,steps:[],dxf:[],pdf:[],otherPdf:[],cad:[]},loose=[];let hasDraw=false;
  const M=f=>{VER[f.id]=f.modifiedTime;SIZE[f.id]=+f.size||0;return {id:f.id,name:f.name,size:+f.size||0,updated:Date.parse(f.modifiedTime)}};
  const walk=async(fid,path,depth)=>{const items=await driveList(fid),subs=[];
    for(const x of items){const n=x.name.toLowerCase();
      if(x.mimeType==='application/vnd.google-apps.folder'){if(x.name[0]==='_'||/superseded|old|archive/i.test(x.name))continue;if(/draw|pdf/i.test(x.name))hasDraw=true;if(depth<3)subs.push(x)}
      else if(/\.(step|stp)$/.test(n))out.steps.push(M(x));else if(/\.dxf$/.test(n))out.dxf.push(M(x));
      else if(/\.pdf$/.test(n))(/draw|pdf/.test(path)?out.pdf:loose).push(M(x));else if(/\.(sldprt|sldasm|slddrw)$/.test(n))out.cad.push(x.name)}
    await Promise.all(subs.map(x=>walk(x.id,path+'/'+x.name.toLowerCase(),depth+1)))};
  await walk(id,'',0);if(hasDraw)out.otherPdf=loose;else out.pdf=out.pdf.concat(loose);out.steps.sort((a,b)=>b.updated-a.updated);return out}
const PROG={total:0,done:0};function prog(add,pct){if(add)PROG.done+=add;const v=pct!=null?pct:Math.min(85,Math.round(PROG.done/Math.max(PROG.total,1)*85));const i=$('barI'),p=$('barP');if(i)i.style.width=v+'%';if(p)p.textContent=v+'%'}
let active=0;const queue=[];const slot=()=>new Promise(ok=>{if(active<3){active++;ok()}else queue.push(ok)}),free=()=>{const n=queue.shift();if(n)n();else active--};
const VER={},SIZE={};// id -> modifiedTime, filled when the folder is scanned
async function media(id){const key='https://cache.local/'+id+'@'+(VER[id]||0);let c=null;try{c=await caches.open('drawing-review-v1');const hit=await c.match(key);if(hit){const u=new Uint8Array(await hit.arrayBuffer());prog(SIZE[id]||u.length);return u}}catch(e){}
  await slot();try{let b;try{try{b=await gfetch('https://www.googleapis.com/download/drive/v3/files/'+id+'?alt=media')}catch(e1){b=await gfetch(G+'/'+id+'?alt=media')}}catch(e){if(/reach Google Drive/.test(e.message))throw new Error('Google Drive is limiting downloads from this network for a few minutes (too many requests). Wait 5–10 minutes and reload the page.');throw e}
    prog(SIZE[id]||b.length);try{if(c)await c.put(key,new Response(b.slice()))}catch(e){}return b}finally{free()}}
const fileBytes=id=>media(id),fileText=async id=>new TextDecoder('latin1').decode(await media(id));
function parseLink(s){s=String(s||'').trim();const m=s.match(/folders\/([\w-]{15,})/)||s.match(/[?&]id=([\w-]{15,})/)||s.match(/^([\w-]{15,})$/);
  if(!m){if(/\/file\/d\//.test(s))throw new Error('That is a link to a single file. Paste the link of the FOLDER.');throw new Error('Paste the link of a Google Drive folder (it contains /folders/).')}
  return {id:m[1],rk:(s.match(/resourcekey=([\w-]+)/)||[])[1]||''}}
try{localStorage.removeItem('rv_recent');localStorage.removeItem('rv_name');Object.keys(localStorage).filter(k=>k.startsWith('rv_dec_')).forEach(k=>localStorage.removeItem(k))}catch(e){}
const ls={get:k=>{try{return localStorage.getItem(k)||''}catch(e){return ''}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const b64u8=b=>{const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u};

/* ================= start page ================= */
if(/PASTE_/.test(API_KEY)){
  $('app').innerHTML='<header><div><h1>Drawing review</h1><div class="sub">Almost ready</div></div></header><div class="plist"><p>Put your Google Drive API key in index.html (the line <code>const API_KEY=</code>) and upload it again.</p></div>';
} else if(!PROJECT_ID) landing(); else startProject();

function landing(){
  $('app').innerHTML=`<header><div><h1>Drawing review</h1><div class="sub">Paste a Google Drive folder link and press Open</div></div></header>
  <div class="upl panel">
   <div class="lkrow"><textarea id="lkUrl" rows="1" wrap="off" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-lpignore="true" data-form-type="other" placeholder="Paste Google Drive folder link" aria-label="Google Drive folder link"></textarea><button id="lkGo" class="on">Open</button></div>
   <div class="sub">The folder's sharing must be "Anyone with the link". STEP, DXF and PDF files are found in all its sub-folders. Then send the page's link to the engineer.</div>
   <div class="msg" id="lkMsg"></div>
  </div>`;
  const go=async()=>{const M=$('lkMsg');M.className='msg';
    let L;try{L=parseLink($('lkUrl').value)}catch(e){M.textContent=e.message;M.className='msg err';$('lkUrl').focus();return}
    M.textContent='Opening…';location.href=APP_URL+'?f='+L.id+(L.rk?'&rk='+L.rk:'')};
  $('lkGo').onclick=go;$('lkUrl').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();go()}});$('lkUrl').addEventListener('input',e=>{const t=e.target,v=t.value.replace(/[\r\n]+/g,'');if(v!==t.value)t.value=v});
}

/* ================= project page ================= */
function startProject(){
$('app').innerHTML=`
<header>
  <div><div class="sub"><a href="${esc(APP_URL)}">Open another folder</a></div><h1 id="pName">Loading…</h1><div class="sub" id="pSub"></div></div>
  <div class="release" style="flex-direction:column;align-items:flex-end;gap:6px"><button class="apbtn" id="stamp" title="Opens WhatsApp with the approval message">Approve</button><div class="sub" id="apInfo" style="margin:0"></div></div>
</header>
<main>
  <aside><div class="rail-h">Parts — click to view · tick to send to a client</div><div id="rail"></div></aside>
  <section class="center">
    <div class="tabs" id="tabs">

    </div>
    <div class="pane show" id="p-3d">

function init(){
let P=null, PARTS=[], sel=null, tab='3d', reviews=[], stepMeta=null, MAIN_PDF=null, CHECKS=[];
const pdfDocs={},pdfBytes={},pageTexts={},picked=new Set();

/* ---------- DXF parsing ---------- */
function parseDxf(text){
  const L=text.split(/\r?\n/),ents=[],unsupported={},texts=[],layerLt={};let txt=false;
  {let inL=false,nm=null;for(let k=0;k<L.length-1;k+=2){const c=+L[k].trim(),v=L[k+1].trim();if(c===2&&v==='ENTITIES')break;if(c===0){inL=v==='LAYER';nm=null;continue}if(inL&&c===2)nm=v;if(inL&&c===6&&nm)layerLt[nm]=v}}
  let i=0;while(i<L.length-1&&!(L[i].trim()==='2'&&L[i+1].trim()==='ENTITIES'))i++;
  i+=2;let cur=null;
  const push=()=>{if(cur)ents.push(cur);cur=null};
  for(;i<L.length-1;i+=2){const c=+L[i].trim(),v=L[i+1].trim();
    if(c===0){push();if(v==='ENDSEC')break;
      if(['LINE','CIRCLE','ARC','LWPOLYLINE'].includes(v))cur={t:v,layer:'0',pts:[],b:[]};else if(v==='TEXT'||v==='MTEXT'){cur=null;txt=true}else{unsupported[v]=(unsupported[v]||0)+1}if(v!=='TEXT'&&v!=='MTEXT')txt=false;continue}
    if(txt&&(c===1||c===3)){texts.push(v)}
    if(!cur)continue;
    if(c===8)cur.layer=v;else if(c===6)cur.lt=v;
    else if(cur.t==='LWPOLYLINE'){if(c===10)cur.pts.push([+v,0]),cur.b.push(0);else if(c===20)cur.pts[cur.pts.length-1][1]=+v;else if(c===42)cur.b[cur.b.length-1]=+v;else if(c===70)cur.closed=(+v&1)===1}
    else{if(c===10)cur.x=+v;else if(c===20)cur.y=+v;else if(c===11)cur.x2=+v;else if(c===21)cur.y2=+v;else if(c===40)cur.r=+v;else if(c===50)cur.a1=+v;else if(c===51)cur.a2=+v}}
  delete unsupported.SEQEND;delete unsupported.VERTEX;
  return {ents,unsupported,texts,layerLt};
}
const DASH=/hidden|dash|center|phantom|dot|divide|border/i;let LAYER_LT={};const isBend=(l,lt)=>/bend/i.test(l)||DASH.test(lt||'')||(!lt||/bylayer/i.test(lt))&&DASH.test(LAYER_LT[l]||'');
function arcPts(cx,cy,r,a1,a2){let s=a1*Math.PI/180,e=a2*Math.PI/180;if(e<=s)e+=2*Math.PI;const n=Math.max(4,Math.ceil((e-s)/(Math.PI/24))),o=[];for(let k=0;k<=n;k++){const a=s+(e-s)*k/n;o.push([cx+r*Math.cos(a),cy+r*Math.sin(a)])}return o}
function bulgePts(p,q,b){if(!b)return [p,q];const th=4*Math.atan(b),d=Math.hypot(q[0]-p[0],q[1]-p[1]),r=d/(2*Math.sin(th/2)),mx=(p[0]+q[0])/2,my=(p[1]+q[1])/2,h=r*Math.cos(th/2),nx=-(q[1]-p[1])/d,ny=(q[0]-p[0])/d;
  const cx=mx+nx*h,cy=my+ny*h,a1=Math.atan2(p[1]-cy,p[0]-cx);const n=12,o=[];for(let k=0;k<=n;k++){const a=a1+th*k/n;o.push([cx+Math.abs(r)*Math.cos(a)*Math.sign(r)*Math.sign(r),cy+Math.abs(r)*Math.sin(a)])}o[0]=p;o[n]=q;return o}
/* segments (non-bend), circles, polylines for drawing */
function geom(d){const segs=[],polys=[],circles=[];
  LAYER_LT=d.layerLt||{};for(const e of d.ents){const b=isBend(e.layer,e.lt);
    if(e.t==='LINE'){polys.push({p:[[e.x,e.y],[e.x2,e.y2]],b});if(!b)segs.push([[e.x,e.y],[e.x2,e.y2]])}
    else if(e.t==='CIRCLE'){circles.push({x:e.x,y:e.y,r:e.r,b})}
    else if(e.t==='ARC'){const p=arcPts(e.x,e.y,e.r,e.a1,e.a2);polys.push({p,b});if(!b)for(let k=0;k<p.length-1;k++)segs.push([p[k],p[k+1]])}
    else if(e.t==='LWPOLYLINE'){const n=e.pts.length,all=[];for(let k=0;k<(e.closed?n:n-1);k++){const s=bulgePts(e.pts[k],e.pts[(k+1)%n],e.b[k]);if(k)s.shift();all.push(...s)}polys.push({p:all,b});if(!b)for(let k=0;k<all.length-1;k++)segs.push([all[k],all[k+1]])}}
  return {segs,polys,circles}}
function flatArea(g){const key=p=>Math.round(p[0]*50)+','+Math.round(p[1]*50),adj=new Map(),used=new Set();
  g.segs.forEach((s,i)=>{for(const p of s){const k=key(p);if(!adj.has(k))adj.set(k,[]);adj.get(k).push(i)}});
  const loops=[];let open=0;
  for(let i=0;i<g.segs.length;i++){if(used.has(i))continue;used.add(i);const pts=[g.segs[i][0],g.segs[i][1]];let ok=false;
    for(let guard=0;guard<100000;guard++){const end=pts[pts.length-1];if(key(end)===key(pts[0])&&pts.length>2){ok=true;break}
      const nx=(adj.get(key(end))||[]).find(j=>!used.has(j));if(nx===undefined)break;used.add(nx);const s=g.segs[nx];pts.push(key(s[0])===key(end)?s[1]:s[0])}
    if(ok){let a=0;for(let k=0;k<pts.length-1;k++)a+=pts[k][0]*pts[k+1][1]-pts[k+1][0]*pts[k][1];loops.push(Math.abs(a)/2)}else open++}
  const holes=g.circles.filter(c=>!c.b).reduce((s,c)=>s+Math.PI*c.r*c.r,0);
  let area=null;if(loops.length){loops.sort((a,b)=>b-a);area=loops[0]-loops.slice(1).reduce((s,x)=>s+x,0)-holes}
  if(!(area>0)||open){const e=extents(g),bb=(e[2]-e[0])*(e[3]-e[1])-holes;if(!(area>0)||open&&Math.abs(area-bb)/bb>0.15)area=bb>0?bb:null}
  return {area,open}}
function extents(g){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;const up=(x,y)=>{x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y)};
  for(const p of g.polys)for(const q of p.p)up(q[0],q[1]);for(const c of g.circles){up(c.x-c.r,c.y-c.r);up(c.x+c.r,c.y+c.r)}return [x0,y0,x1,y1]}

/* ---------- names ---------- */
function partFromDxf(m){const base=m.name.replace(/\.dxf$/i,'');const nice=base.replace(/^\s*[A-Za-z0-9]+\s*[._\-)]?\s*/,'').replace(/[-_ ]*thickness.*$/i,'').replace(/[-_ ]*qty.*$/i,'').replace(/[_\s-]+$/,'').trim();const k=(base.match(/^\s*([A-Za-z0-9]+)/)||[])[1]||base;
  const q=base.match(/qty\s*[:=]?\s*(\d+)/i),t=base.match(/(\d+(?:\.\d+)?)\s*mm/i);
  return {k,nice,qty:q?+q[1]:null,t:t?+t[1]:null,rl:/R\s*&\s*L/i.test(base),dxfMeta:m}}
const tokens=n=>n.replace(/\.[^.]+$/,'').split(/[\s_.\-()]+/).filter(Boolean);
const isMain=n=>/main|assembly|assy|general/i.test(n);

/* ---------- one PDF with many pages: find each part's page ---------- */
function numsOf(t){const out=new Set();for(const tok of t.split(/\s+/))for(const x of [tok,[...tok].reverse().join('')]){const m=x.match(/^[^\d]*?(\d+(?:\.\d+)?)[^\d]*$/);if(m)out.add((+m[1]).toFixed(1))}return out}
function splitCombined(){const cands=[];
  for(const f of (P.extraPdf||[])){const pt=pageTexts[f.id];if(!pt)continue;let qi=0;
    pt.forEach((t,i)=>{const q=t.match(/QTY\s*:?\s*(\d+)\s*(\(\s*\d*\s*R\s*&\s*\d*\s*L\s*\))?/i);cands.push({f,page:i+1,q,nums:numsOf(t),t,qi:q?qi++:-1})})}
  if(!cands.length)return;
  const need=PARTS.filter(p=>!p.pdfMeta),pairs=[];
  for(const p of need)for(const c of cands){if(!c.q)continue;let sc=(p.qty!=null&&+c.q[1]===p.qty)?3:-3;if(!!c.q[2]===p.rl)sc+=2;
    if(p.ext)for(const d of [p.ext[2]-p.ext[0],p.ext[3]-p.ext[1]])if(c.nums.has((+d).toFixed(1)))sc+=2;
    if(PARTS.indexOf(p)===c.qi)sc+=1;pairs.push({p,c,sc})}
  pairs.sort((a,b)=>b.sc-a.sc);const uP=new Set(),uC=new Set();
  for(const x of pairs){if(x.sc<3||uP.has(x.p)||uC.has(x.c))continue;uP.add(x.p);uC.add(x.c);
    x.p.pdfMeta={id:x.c.f.id,name:x.c.f.name,updated:x.c.f.updated,size:x.c.f.size,page:x.c.page,text:x.c.t}}
  if(!MAIN_PDF){const m=cands.find(c=>!c.q&&!uC.has(c));if(m){MAIN_PDF={id:m.f.id,name:m.f.name,updated:m.f.updated,page:m.page};uC.add(m)}}
  const usedF=new Set([...uC].map(c=>c.f));P.extraPdf=(P.extraPdf||[]).filter(f=>!usedF.has(f))}

/* ---------- which drawing page belongs to which part: by the dimensions written on it ---------- */
let fillPdfSel=()=>{};
function partDims(p){const d=new Set(),add=v=>{if(v>=5)d.add((+v).toFixed(1))};
  if(p.ext){add(p.ext[2]-p.ext[0]);add(p.ext[3]-p.ext[1])}
  const m=meshes.find(m=>m.userData.part===p.k);if(m)for(const v of m.userData.dims)add(v);
  if(p.g)for(const c of p.g.circles)if(!c.b)add(c.r*2);
  return d}
function assignDrawings(){
  const pages=[];for(const id in pageTexts){const f=[...P.pdf,...(P.otherPdf||[])].find(x=>x.id===id);if(!f)continue;
    pageTexts[id].forEach((t,i)=>{const q=t.match(/QTY\s*:?\s*(\d+)\s*(\(\s*\d*\s*R\s*&\s*\d*\s*L\s*\))?/i);
      pages.push({f,page:i+1,t,key:t.replace(/\s+/g,' ').trim(),single:pageTexts[id].length===1,nums:numsOf(t),q,asm:/explod|assembl|bill of material|\bBOM\b|main view|general arrangement/i.test(t)})})}
  pages.sort((a,b)=>b.single-a.single);for(const p of PARTS){p.pdfMeta=null}MAIN_PDF=null;
  if(!pages.length)return;
  const dims=PARTS.map(p=>({p,d:partDims(p)})),freq={};for(const x of dims)for(const v of x.d)freq[v]=(freq[v]||0)+1;
  const pairs=[];
  for(const x of dims)for(const g of pages){if(g.asm)continue;let sc=0,hits=0;for(const v of x.d)if(g.nums.has(v)){sc+=1/freq[v];hits++}
    if(!hits)continue;if(g.q){sc+=(x.p.qty!=null&&+g.q[1]===x.p.qty)?1.5:-2;if(!!g.q[2]===x.p.rl)sc+=0.5}else sc-=0.5;
    pairs.push({p:x.p,g,sc})}
  pairs.sort((a,b)=>b.sc-a.sc);const uP=new Set(),uG=new Set();
  for(const x of pairs){if(x.sc<1.2||uP.has(x.p)||uG.has(x.g.key))continue;
    const rival=pairs.find(y=>y.g===x.g&&y.p!==x.p&&!uP.has(y.p)&&y.sc>x.sc-0.25);if(rival&&!x.g.q)continue; // page fits several parts equally: an assembly sheet
    uP.add(x.p);uG.add(x.g.key);x.p.pdfMeta={id:x.g.f.id,name:x.g.f.name,updated:x.g.f.updated,size:x.g.f.size,page:x.g.page,text:x.g.t}}
  const rest=pages.filter(g=>!uG.has(g.key));const main=rest.find(g=>g.asm)||rest.find(g=>!g.q);
  if(main)MAIN_PDF={id:main.f.id,name:main.f.name,updated:main.f.updated,page:main.page}}

/* ---------- load ---------- */
const loadMsg=t=>{$('loadMsg').textContent=t};
const loadErr=t=>{$('loadMsg').textContent=t;$('load3d').classList.add('err')};
(async()=>{
  try{
    P=await scanProject(PROJECT_ID);
  }catch(e){$('pName').textContent='Project not available';loadErr(e.message);return}
  $('pName').textContent=P.name;
  try{reviews=JSON.parse(ls.get('rv_ap2_'+PROJECT_ID)||'[]')}catch(e){reviews=[]}
  PARTS=P.dxf.map(partFromDxf).sort((a,b)=>a.k.localeCompare(b.k,undefined,{numeric:true}));
  const keys=new Set(PARTS.map(p=>p.k));
  P.extraPdf=[];
  stepMeta=P.steps[0]||null;
  $('pSub').textContent=`${PARTS.length} parts · ${PARTS.reduce((s,p)=>s+(p.qty||0),0)} pieces · model ${stepMeta?stepMeta.name:'missing'}`;
  sel=PARTS[0]?.k||null;renderRail();renderReview();
  PROG.total=[...P.dxf,...P.pdf,...(P.otherPdf||[]),...(stepMeta?[stepMeta]:[])].filter((m,i,a)=>a.findIndex(x=>x.id===m.id)===i).reduce((s,m)=>s+(m.size||1),0);prog(0);
  loadMsg(`Loading ${PARTS.length} flat patterns…`);
  await Promise.all(PARTS.map(async p=>{try{p.dxfRaw=await fileText(p.dxfMeta.id);p.dxf=parseDxf(p.dxfRaw);{const T=p.dxf.texts.join(' ').replace(/\\[A-Za-z][^;]*;/g,' ');if(p.t==null){const m=T.match(/(?:thk|thick(?:ness)?|\bt)\s*[:=]?\s*(\d+(?:\.\d+)?)\s*(?:mm)?/i);if(m)p.t=+m[1]}if(p.qty==null){const m=T.match(/qty\s*[:=.]?\s*(\d+)/i);if(m)p.qty=+m[1]}}p.g=geom(p.dxf);p.fa=flatArea(p.g);p.ext=extents(p.g)}catch(e){p.dxfErr=e.message}}));
  renderRail();if(tab==='dxf')drawDxf();
  loadMsg('Loading drawings…');
  await initPdf();
  await Promise.all([...P.pdf,...(P.otherPdf||[])].filter((m,i,a)=>a.findIndex(x=>x.id===m.id)===i).map(async m=>{try{const by=await fileBytes(m.id);pdfBytes[m.id]=by.slice();const doc=await pdfjsLib.getDocument({isEvalSupported:false,data:by}).promise;pdfDocs[m.id]=doc;
    const pt=[];for(let n=1;n<=Math.min(doc.numPages,60);n++){const c=await (await doc.getPage(n)).getTextContent();pt.push(c.items.map(i=>i.str).join(' '))}pageTexts[m.id]=pt;m.text=pt.slice(0,3).join(' ')}catch(e){m.err=e.message}}));
  assignDrawings();renderRail();
  {const all=[...P.pdf,...(P.otherPdf||[])].filter((m,i,a)=>a.findIndex(x=>x.id===m.id)===i&&pdfDocs[m.id]);
   fillPdfSel=()=>{const used=new Set(PARTS.filter(p=>p.pdfMeta).map(p=>p.pdfMeta.id+'#'+p.pdfMeta.page)),o=m=>`<option value="${esc(m.id)}">${esc(m.name)}${pdfDocs[m.id].numPages>1?' — '+pdfDocs[m.id].numPages+' pages':''}</option>`;
     const other=all.filter(m=>{for(let n=1;n<=pdfDocs[m.id].numPages;n++)if(!used.has(m.id+'#'+n))return true;return false}),parts=all.filter(m=>!other.includes(m));
     $('pdfSel').innerHTML='<option value="">All drawings ('+all.length+')…</option>'+(parts.length?'<optgroup label="Part sheets">'+parts.map(o).join('')+'</optgroup>':'')+(other.length?'<optgroup label="Other drawings (assembly / not linked to one part)">'+other.map(o).join('')+'</optgroup>':'')};fillPdfSel();
   $('pdfSel').onchange=()=>{const id=$('pdfSel').value;if(!id)return;pdfFile=all.find(m=>m.id===id);pdfMode='file';loadPdf()}}
  if(tab==='pdf')loadPdf();
  if(stepMeta){loadMsg('Loading 3D model ('+(stepMeta.size/1048576).toFixed(1)+' MB)…');
    try{const stepBytes=await fileBytes(stepMeta.id);loadMsg('Reading 3D model…');prog(0,90);await new Promise(r=>setTimeout(r,30));
      const occt=await occtimportjs({locateFile:f=>OCCT_BASE+f});
      const res=occt.ReadStepFile(stepBytes,{linearUnit:'millimeter',linearDeflectionType:'absolute_value',linearDeflection:0.3,angularDeflection:0.3});
      if(!res.success)throw new Error('The STEP file could not be read.');
      build3d(res.meshes);prog(0,100);
    }catch(e){loadErr('3D model could not be opened: '+e.message);P.stepErr=e.message}}
  else loadErr((P.cad&&P.cad.length?'Only SolidWorks files found. ':'')+'Add a STEP export of the model to the project folder to see it in 3D.');
  mapBodies();assignDrawings();fillPdfSel();renderRail();renderReview();paint3d();
  if(meshes.length){$('load3d').classList.add('hide');view('iso')}
})();

/* ---------- body → part mapping ---------- */
let groups=[];
function mapBodies(){if(!meshes.length)return;
  for(const m of meshes)m.userData.part=null;
  // 1) by body name
  for(const m of meshes){const n=(m.userData.name||'').trim();if(!n)continue;const tk=tokens(n);const p=PARTS.find(p=>tk[0]===p.k||tk[tk.length-1]===p.k);if(p)m.userData.part=p.k}
  // 2) by geometry: identical bodies (same volume and surface area, whatever their angle), then volume ≈ flat area × thickness
  const free=meshes.filter(m=>!m.userData.part);groups=[];
  for(const m of free){const u=m.userData;const g=groups.find(g=>Math.abs(g.vol-u.vol)/u.vol<0.004&&Math.abs(g.area-u.area)/u.area<0.006);if(g)g.ms.push(m);else groups.push({vol:u.vol,area:u.area,ms:[m]})}
  const GA=[0.5,0.6,0.7,0.8,0.9,1,1.2,1.25,1.5,1.6,2,2.5,3,4,5,6,8,10,12];
  for(const g of groups){const raw=2*g.vol/g.area,near=GA.reduce((a,b)=>Math.abs(b-raw)<Math.abs(a-raw)?b:a);g.t=Math.abs(near-raw)/near<0.15?near:+raw.toFixed(2)}
  const todo=PARTS.filter(p=>!meshes.some(m=>m.userData.part===p.k)&&p.fa&&p.fa.area),pairs=[];
  for(const p of todo)for(const g of groups){if(p.t&&Math.abs(g.t-p.t)/p.t>0.3)continue;const tg=p.fa.area*(p.t||g.t);if(!(tg>0))continue;const err=Math.abs(g.vol-tg)/tg;if(err<0.08)pairs.push({p,g,err,cnt:g.ms.length===p.qty?0:1})}
  pairs.sort((x,y)=>x.cnt-y.cnt||x.err-y.err);
  for(const x of pairs){if(x.g.part||x.p.matchErr!=null)continue;x.g.part=x.p.k;x.p.matchErr=x.err;if(!x.p.t)x.p.tModel=x.g.t;for(const m of x.g.ms)m.userData.part=x.p.k}
  // leftovers: same piece count and the closest volume (marked so it gets checked)
  for(const p of todo.filter(p=>p.matchErr==null)){const tg=p.fa.area*(p.t||1.5);
    const c=groups.filter(g=>!g.part&&g.ms.length===p.qty&&g.vol>tg*0.4&&g.vol<tg*2.5).sort((a,b)=>Math.abs(a.vol-tg)-Math.abs(b.vol-tg))[0];
    if(c){c.part=p.k;p.matchErr=Math.abs(c.vol-tg)/tg;p.guess=true;if(!p.t)p.tModel=c.t;for(const m of c.ms)m.userData.part=p.k}}
  for(const p of PARTS)p.bodies=meshes.filter(m=>m.userData.part===p.k).length;
  window.__rv={parts:PARTS.map(p=>({k:p.k,qty:p.qty,t:p.t,flat:p.fa&&p.fa.area,open:p.fa&&p.fa.open,target:p.fa&&p.fa.area*p.t,err:p.matchErr,n:p.bodies})),groups:groups.map(g=>({vol:Math.round(g.vol),area:Math.round(g.area),n:g.ms.length,part:g.part,m:g.ms.map(m=>[+m.userData.vol.toFixed(1),+m.userData.area.toFixed(1),m.userData.dims.map(d=>+d.toFixed(1)).join('x')])}))};
}

/* ---------- pre-checks ---------- */
function runChecks(){const C=[];const add=(s,t,p,k)=>C.push({s,t,p,k});
  if(!stepMeta)add('issue','No 3D model (STEP) in the project folder',(P.cad&&P.cad.length?'Found SolidWorks files ('+P.cad.slice(0,3).join(', ')+') — a browser can\'t open those. ':'')+'In SolidWorks: File ▸ Save As ▸ STEP AP214, and put the .step file in the project folder or any sub-folder.');
  if(P.steps.length>1)add('issue','More than one STEP file',`Using the newest: ${stepMeta.name}. Other: ${P.steps.slice(1).map(s=>s.name).join(', ')}. Remove old ones so nobody reviews the wrong model.`);
  if(!PARTS.length)add('issue','No DXF files found','Put the .dxf flats anywhere in the project folder (e.g. a "DXF" sub-folder).');
  let qtyOk=true,flatOk=true;
  for(const p of PARTS){
    if(p.dxfErr){add('issue',`Part ${p.k}: DXF could not be read`,p.dxfErr,p.k);continue}
    const uns=Object.keys(p.dxf.unsupported||{});if(uns.length)add('verify',`Part ${p.k}: DXF has entities this viewer doesn't draw`,uns.join(', ')+' — check the flat in your CAD viewer.',p.k);
    if(p.qty==null)add('issue',`Part ${p.k}: no quantity in the DXF name`,`"${p.dxfMeta.name}" — expected "… _Qty n".`,p.k);
    if(!p.pdfMeta)add('issue',`Part ${p.k}: no drawing PDF`,'No PDF in the Drawings folder is named for this part (e.g. ST_'+p.k+'.pdf).',p.k);

function pick(sx,sy){const r=R.domElement.getBoundingClientRect();ray.setFromCamera({x:sx/r.width*2-1,y:-sy/r.height*2+1},cam);
  const hit=ray.intersectObjects(visMeshes(),false)[0];const cands=hit?[hit.object]:visMeshes();
  const scr=w=>{const v=w.clone().project(cam);return [(v.x+1)/2*r.width,(1-v.y)/2*r.height,v.z]};
  const camPos=cam.position,tol=hit?hit.distance*1.004+dotR()*2:Infinity;
  let best=null;
  for(const m of cands){const ed=edgeData(m);
    for(let i=0;i<ed.segs.length;i++){const [p,q]=ed.segs[i],wp=m.localToWorld(p.clone()),wq=m.localToWorld(q.clone());
      if(wp.distanceTo(camPos)>tol&&wq.distanceTo(camPos)>tol)continue;
      const A=scr(wp),B=scr(wq);
      for(const [W,L,S] of [[wp,p,A],[wq,q,B]]){if(!ed.corner.has(K(L)))continue;const d=Math.hypot(S[0]-sx,S[1]-sy);if(d<12&&(!best||best.kind!=='point'||d<best.d))best={kind:'point',d,m,l:L.clone(),w:W}}
      if(best&&best.kind==='point')continue;
      const dx=B[0]-A[0],dy=B[1]-A[1],t=Math.max(0,Math.min(1,((sx-A[0])*dx+(sy-A[1])*dy)/(dx*dx+dy*dy||1))),d=Math.hypot(A[0]+t*dx-sx,A[1]+t*dy-sy);
      if(d<8&&(!best||d<best.d))best={kind:'seg',d,m,s:i}}}
  if(best&&best.kind==='seg'){const ch=chainOf(best.m,best.s);return {...ch,m:best.m}}
  if(best)return best;
  if(hit)return {kind:'point',surface:true,m:hit.object,l:hit.object.worldToLocal(hit.point.clone()),w:hit.point.clone()};
  return null}
const W=(m,pts)=>pts.map(p=>m.localToWorld(p.clone()));
function describe(h){if(!h)return '';if(h.type==='hole')return `Hole Ø ${f2(h.r*2)} mm`;if(h.type==='arc')return `Bend / arc R ${f2(h.r)} mm`;if(h.type==='edge')return `Edge ${f2(h.len)} mm`;return h.surface?'Point on face':'Corner point'}
function setHover(h,sx,sy){hGroup.clear();if(!h){tip.style.display='none';return}
  if(h.kind==='point')hGroup.add(dot(h.w,matHP));else{const ws=W(h.m,h.pts);hGroup.add(line(ws,matH,h.type==='hole'));if(h.type==='edge')for(const w of ws)hGroup.add(dot(w,matHP))}
  tip.textContent=describe(h)+(h.kind==='point'?(mPts.length===1?' — click to finish the distance':' — click to start a distance'):' — click to measure');
  tip.style.display='block';tip.style.left=(sx+14)+'px';tip.style.top=(sy+14)+'px'}
let hvRaf=0;
R.domElement.addEventListener('pointermove',e=>{if(!measOn||e.buttons){return}const r=R.domElement.getBoundingClientRect(),sx=e.clientX-r.left,sy=e.clientY-r.top;
  cancelAnimationFrame(hvRaf);hvRaf=requestAnimationFrame(()=>setHover(pick(sx,sy),sx,sy))});
R.domElement.addEventListener('pointerleave',()=>setHover(null));
function measure(h){if(!h)return;
  if(h.kind==='point'){if(mPts.length!==1)clearMeas();mPts.push({l:h.l,w:h.w});mGroup.add(dot(h.w,matP));
    if(mPts.length===1){$('mOut').textContent='Now click the second point';return}
    mGroup.add(line([mPts[0].w,mPts[1].w],matL));const d=mPts[1].l.clone().sub(mPts[0].l);mLab=mPts[0].w.clone().add(mPts[1].w).multiplyScalar(.5);lbl.textContent=f2(d.length())+' mm';
    $('mOut').innerHTML=`Distance <b>${f2(d.length())} mm</b> · ΔX ${f2(Math.abs(d.x))} · ΔY ${f2(Math.abs(d.y))} · ΔZ ${f2(Math.abs(d.z))}`;mPts=[];return}
  clearMeas();const ws=W(h.m,h.pts);mGroup.add(line(ws,matL,h.type==='hole'));if(h.type==='edge')for(const w of ws)mGroup.add(dot(w,matP));
  mLab=h.type==='hole'?h.m.localToWorld(h.c.clone()):ws[Math.floor(ws.length/2)].clone().add(ws[Math.max(0,Math.floor(ws.length/2)-1)]).multiplyScalar(.5);
  lbl.textContent=describe(h);$('mOut').innerHTML=`<b>${describe(h)}</b>`}
let down=null;R.domElement.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);
R.domElement.addEventListener('pointerup',e=>{if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>8)return;const r=R.domElement.getBoundingClientRect(),sx=e.clientX-r.left,sy=e.clientY-r.top;
  if(measOn){measure(pick(sx,sy));return}
  ray.setFromCamera({x:sx/r.width*2-1,y:-sy/r.height*2+1},cam);const hit=ray.intersectObjects(visMeshes(),false)[0];if(!hit)return;
  one=hit.object;if(hit.object.userData.part&&hit.object.userData.part!==sel)select(hit.object.userData.part,true);else paint3d()});


/* ---------- PDF ---------- */
let pdfMode='part',zoom=0,pdfShown=null,pageNo=1;
async function initPdf(){if(pdfjsLib)return;
  try{pdfjsLib=await import(PDFJS+'pdf.min.mjs')}catch(e){pdfjsLib=null;return}
  try{const t=await (await fetch(PDFJS+'pdf.worker.min.mjs')).text();pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([t],{type:'text/javascript'}))}
  catch(e){pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+'pdf.worker.min.mjs'}}
let pdfFile=null;function curPdf(){const p=PARTS.find(x=>x.k===sel);return pdfMode==='file'?pdfFile:pdfMode==='main'?MAIN_PDF:(p&&p.pdfMeta)}
async function loadPdf(){const m=curPdf(),box=$('pdfBox');$('pdfMain').disabled=!MAIN_PDF;
  if(!m){box.innerHTML='<p class="empty" style="padding:20px">'+(pdfMode==='main'?'No main-views drawing in the Drawings folder.':'No sheet is linked to this part — pick any drawing from the "All drawings" list above.')+'</p>';return}
  if(!pdfDocs[m.id]){box.innerHTML='<p class="empty" style="padding:20px">'+(m.err?esc(m.err):'Loading drawing…')+'</p>';return}
  const key=m.id+'#'+(m.page||1);if(pdfShown!==key){pdfShown=key;zoom=0;pageNo=m.page||1}renderPdf()}
async function renderPdf(){const m=curPdf();if(!m||!pdfDocs[m.id])return;const doc=pdfDocs[m.id],box=$('pdfBox'),pg=await doc.getPage(pageNo),v0=pg.getViewport({scale:1});
  const s=(box.clientWidth-24)/v0.width*Math.pow(1.4,zoom),dpr=Math.min(devicePixelRatio||1,2),v=pg.getViewport({scale:s*dpr});
  const c=document.createElement('canvas');c.width=v.width;c.height=v.height;c.style.width=(v.width/dpr)+'px';c.style.height=(v.height/dpr)+'px';
  await pg.render({canvasContext:c.getContext('2d'),viewport:v}).promise;box.innerHTML='';box.appendChild(c);
  const L=$('pgL');if(doc.numPages>1){L.style.display='flex';L.innerHTML=`<button id="pgP" aria-label="Previous page" style="border:0;min-height:36px">‹</button> Page ${pageNo} / ${doc.numPages} <button id="pgN" aria-label="Next page" style="border:0;min-height:36px">›</button>`;$('pgP').onclick=()=>{if(pageNo>1){pageNo--;renderPdf()}};$('pgN').onclick=()=>{if(pageNo<doc.numPages){pageNo++;renderPdf()}}}else L.style.display='none'}
$('pdfMain').onclick=()=>{pdfMode='main';$('pdfSel').value='';loadPdf()};$('pdfPart').onclick=()=>{pdfMode='part';$('pdfSel').value='';loadPdf()};
$('zIn').onclick=()=>{zoom=Math.min(zoom+1,6);renderPdf()};$('zOut').onclick=()=>{zoom=Math.max(zoom-1,-2);renderPdf()};$('zFit').onclick=()=>{zoom=0;renderPdf()};

/* ---------- DXF view ---------- */
let vb=null,ext=null,dMeas=false,dPts=[],snaps=[];
function drawDxf(){const p=PARTS.find(x=>x.k===sel),box=$('dxfBox');if(!p||!p.g){box.innerHTML='<p class="empty" style="padding:20px">'+(p&&p.dxfErr?esc(p.dxfErr):'Loading flat pattern…')+'</p>';$('dxfFacts').innerHTML='';return}
  const g=p.g;snaps=[];
  for(const q of g.polys){for(const pt of q.p)snaps.push(pt);for(let k=0;k<q.p.length-1;k++)snaps.push([(q.p[k][0]+q.p[k+1][0])/2,(q.p[k][1]+q.p[k+1][1])/2])}
  for(const c of g.circles)snaps.push([c.x,c.y],[c.x+c.r,c.y],[c.x-c.r,c.y],[c.x,c.y+c.r],[c.x,c.y-c.r]);
  ext=p.ext;const W=ext[2]-ext[0],H=ext[3]-ext[1];
  const body=g.polys.map(q=>`<path d="M${q.p.map(pt=>pt[0]+' '+(-pt[1])).join('L')}" ${q.b?'class="bend"':''}/>`).join('')+g.circles.map(c=>`<circle cx="${c.x}" cy="${-c.y}" r="${c.r}" ${c.b?'class="bend"':''}/>`).join('');
  box.innerHTML=`<svg id="dxfSvg" xmlns="http://www.w3.org/2000/svg"><g class="geo">${body}</g><g id="dm"></g><g id="dh"></g></svg>`;dPts=[];dRes=null;fitDxf();
  const holes=g.circles.filter(c=>!c.b),bends=g.polys.filter(q=>q.b).length,dia=[...new Set(holes.map(h=>f2(h.r*2)))];
  $('dxfFacts').innerHTML=`<div>${esc(p.dxfMeta.name)}</div><div>Flat size <b>${f2(W)} × ${f2(H)} mm</b></div><div>Bend lines <b>${bends}</b> · Holes <b>${holes.length}${dia.length?' × Ø'+dia.join(', Ø'):''}</b></div><div id="dOut"></div>`;dOutMsg()}
function dOutMsg(){const o=$('dOut');if(!o)return;if(!dMeas){o.textContent='';return}
  if(dPts.length<2){o.innerHTML=`<span class="sub">${dPts.length?'Now click the second point':'Move over the flat: a corner, an edge, a hole or an arc lights up — click to measure. Two points give a distance.'}</span>`;return}
  const dx=dPts[1][0]-dPts[0][0],dy=dPts[1][1]-dPts[0][1];o.innerHTML=`Distance <b>${f2(Math.hypot(dx,dy))} mm</b> · ΔX ${f2(Math.abs(dx))} · ΔY ${f2(Math.abs(dy))}`}
function drawDm(){const g=$('dm');if(!g||!vb)return;const s=vb[2]/$('dxfBox').clientWidth;if(dRes&&!dPts.length){g.innerHTML=dShape(dRes,'rs');return}
  g.innerHTML=dPts.map(p=>`<circle cx="${p[0]}" cy="${-p[1]}" r="${s*5}" fill="#e4002b"/>`).join('')+(dPts.length===2?`<line x1="${dPts[0][0]}" y1="${-dPts[0][1]}" x2="${dPts[1][0]}" y2="${-dPts[1][1]}" stroke="#e4002b" stroke-width="${s*2}"/>`:'')}
function setVb(){const s=$('dxfSvg');if(s){s.setAttribute('viewBox',vb.join(' '));drawDm()}}
function fitDxf(){const b=$('dxfBox'),[x0,y0,x1,y1]=ext,pad=Math.max(x1-x0,y1-y0)*.06,w=x1-x0+2*pad,h=y1-y0+2*pad,ar=b.clientWidth/Math.max(b.clientHeight,1);
  let vw=w,vh=h;if(w/h<ar)vw=h*ar;else vh=w/ar;vb=[(x0+x1)/2-vw/2,-(y0+y1)/2-vh/2,vw,vh];setVb()}
$('dxfFit').onclick=()=>ext&&fitDxf();
$('dxfM').onclick=()=>{dMeas=!dMeas;dRes=null;$('dxfM').classList.toggle('on',dMeas);$('dxfM').setAttribute('aria-pressed',dMeas);dPts=[];drawDm();dOutMsg();$('dxfBox').style.cursor=dMeas?'crosshair':''};
const dbx=$('dxfBox');let drag=null;
function zoomAt(f,cx,cy){const r=dbx.getBoundingClientRect();cx??=r.left+r.width/2;cy??=r.top+r.height/2;const px=vb[0]+(cx-r.left)/r.width*vb[2],py=vb[1]+(cy-r.top)/r.height*vb[3];vb=[px-(px-vb[0])*f,py-(py-vb[1])*f,vb[2]*f,vb[3]*f];setVb()}
$('dIn').onclick=()=>vb&&zoomAt(1/1.4);$('dOut2').onclick=()=>vb&&zoomAt(1.4);
dbx.addEventListener('wheel',e=>{if(!vb)return;e.preventDefault();zoomAt(e.deltaY>0?1.15:1/1.15,e.clientX,e.clientY)},{passive:false});
const ptrs=new Map();let pinch=null;
dbx.addEventListener('pointerdown',e=>{if(!vb)return;ptrs.set(e.pointerId,[e.clientX,e.clientY]);dbx.setPointerCapture(e.pointerId);
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch=Math.hypot(a[0]-b[0],a[1]-b[1]);drag=null}else drag=[e.clientX,e.clientY,vb[0],vb[1]]});
dbx.addEventListener('pointercancel',e=>{ptrs.delete(e.pointerId);pinch=null;drag=null});
dbx.addEventListener('pointermove',e=>{if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(pinch&&ptrs.size===2){const [a,b]=[...ptrs.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(d>0){zoomAt(pinch/d,(a[0]+b[0])/2,(a[1]+b[1])/2);pinch=d}return}
  if(!drag||!vb)return;const r=dbx.getBoundingClientRect();vb[0]=drag[2]-(e.clientX-drag[0])/r.width*vb[2];vb[1]=drag[3]-(e.clientY-drag[1])/r.height*vb[3];setVb()});
let dRes=null;
function dPick(e){const p=PARTS.find(x=>x.k===sel);if(!p||!p.g||!vb)return null;const r=dbx.getBoundingClientRect(),px=r.width/vb[2],x=vb[0]+(e.clientX-r.left)/px,y=-(vb[1]+(e.clientY-r.top)/px);
  let best=null,bd=12;for(const q of snaps){const d=Math.hypot(q[0]-x,q[1]-y)*px;if(d<bd){bd=d;best={kind:'point',pt:q}}}if(best)return best;
  let bc=null,bcd=8;for(const c of p.g.circles){const d=Math.abs(Math.hypot(c.x-x,c.y-y)-c.r)*px;if(d<bcd){bcd=d;bc=c}}if(bc)return {kind:'hole',c:bc};
  let bs=null,bsd=8;for(const q of p.g.polys)for(let i=0;i<q.p.length-1;i++){const A=q.p[i],B=q.p[i+1],dx=B[0]-A[0],dy=B[1]-A[1],t=Math.max(0,Math.min(1,((x-A[0])*dx+(y-A[1])*dy)/(dx*dx+dy*dy||1))),d=Math.hypot(A[0]+t*dx-x,A[1]+t*dy-y)*px;if(d<bsd){bsd=d;bs={q,i}}}
  if(!bs)return {kind:'point',pt:[x,y],free:true};
  const q=bs.q;if(q.p.length>2&&q.p.length!==3||q.p.length>3){const A=q.p[0],B=q.p[Math.floor(q.p.length/2)],C=q.p[q.p.length-1],a=Math.hypot(B[0]-C[0],B[1]-C[1]),b=Math.hypot(A[0]-C[0],A[1]-C[1]),c=Math.hypot(A[0]-B[0],A[1]-B[1]),ar=Math.abs((B[0]-A[0])*(C[1]-A[1])-(C[0]-A[0])*(B[1]-A[1]))/2;
    if(ar>1e-6&&q.p.length>4)return {kind:'arc',q,r:a*b*c/(4*ar)}}
  const A=q.p[bs.i],B=q.p[bs.i+1];return {kind:'line',seg:[A,B],len:Math.hypot(B[0]-A[0],B[1]-A[1]),bend:q.b}}
const dDesc=h=>h.kind==='hole'?`Hole Ø ${f2(h.c.r*2)} mm`:h.kind==='arc'?`Arc R ${f2(h.r)} mm`:h.kind==='line'?`${h.bend?'Bend line':'Edge'} ${f2(h.len)} mm`:h.free?'Point':'Corner / centre point';
function dShape(h,cls){const s=vb[2]/dbx.clientWidth;if(!h)return '';
  if(h.kind==='point')return `<circle cx="${h.pt[0]}" cy="${-h.pt[1]}" r="${s*6}" class="${cls}f"/>`;
  if(h.kind==='hole')return `<circle cx="${h.c.x}" cy="${-h.c.y}" r="${h.c.r}" class="${cls}" stroke-width="3"/>`;
  const pts=h.kind==='arc'?h.q.p:h.seg;return `<path d="M${pts.map(p=>p[0]+' '+(-p[1])).join('L')}" class="${cls}" stroke-width="3"/>`}
const dTip=document.createElement('div');dTip.className='mtip';dbx.parentNode.appendChild(dTip);
dbx.addEventListener('pointermove',e=>{if(!dMeas||e.buttons||pinch)return;const h=dPick(e),g=$('dh');if(!g)return;g.innerHTML=h?dShape(h,'hv'):'';
  if(!h){dTip.style.display='none';return}const r=dbx.getBoundingClientRect(),pr=dbx.parentNode.getBoundingClientRect();
  dTip.textContent=dDesc(h)+(h.kind==='point'?(dPts.length===1?' — click to finish the distance':' — click to start a distance'):' — click to measure');dTip.style.display='block';dTip.style.left=(e.clientX-pr.left+14)+'px';dTip.style.top=(e.clientY-pr.top+14)+'px'});
dbx.addEventListener('pointerleave',()=>{const g=$('dh');if(g)g.innerHTML='';dTip.style.display='none'});
dbx.addEventListener('pointerup',e=>{ptrs.delete(e.pointerId);if(pinch){if(ptrs.size<2)pinch=null;drag=null;return}const d=drag;drag=null;if(!d||!dMeas||Math.hypot(e.clientX-d[0],e.clientY-d[1])>6)return;
  const h=dPick(e);if(!h)return;
  if(h.kind==='point'){if(dPts.length!==1){dPts=[];dRes=null}dPts.push(h.pt);drawDm();dOutMsg();return}
  dPts=[];dRes=h;drawDm();const o=$('dOut');if(o)o.innerHTML=`<b>${dDesc(h)}</b>`});
const roD=new ResizeObserver(()=>{if(tab==='dxf'&&ext)fitDxf()});roD.observe(dbx);
}
}
